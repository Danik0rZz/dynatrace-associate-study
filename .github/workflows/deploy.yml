# Comprueba y publica la app en GitHub Pages en cada cambio de la rama main.
# Si falla cualquier comprobación (tipos, ESLint, tests —incluido el inventario de cobertura— o la compilación),
# no se publica nada y la versión anterior sigue en línea.
name: Comprobar y publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos y ESLint
        run: npm run lint
      - name: Tests (contenido, cobertura en la guía, inventario, interfaz)
        run: npm test
      - name: Compilación
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
